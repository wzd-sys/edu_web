version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: edu_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: edu_web
      MYSQL_USER: edu_user
      MYSQL_PASSWORD: edu_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: edu_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edu_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mysql://edu_user:edu_password@mysql:3306/edu_web
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: edu-web-jwt-secret-change-in-production
      JWT_EXPIRES_IN: 24h
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-sk-placeholder}
      AI_MODEL: ${AI_MODEL:-qwen-turbo}
      AI_BASE_URL: ${AI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE: 52428800
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edu_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
  uploads_data:
